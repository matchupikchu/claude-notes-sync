# notes-sync configuration (shell syntax: KEY="value").
# Environment variables of the same name and push-notes options take precedence.

# Directory holding the notes. This directory is the git repository that gets
# pushed to the remote.
NOTES_DIR="$HOME/notatki-claude"

# Directory (inside NOTES_DIR) for the session notes written by the SessionEnd
# hook. Day directories are created inside it:
# <NOTES_DIR>/<NOTES_SUMMARY_DIR>/YYYY-MM-DD/
NOTES_SUMMARY_DIR="podsumowania"

# Language the notes themselves are written in. A code such as "pl" or "en",
# or a language name ("Polish", "Brazilian Portuguese"). This only steers what
# the model writes - the code, comments and messages are English either way.
NOTES_LANG="pl"

# Remote repository URL (SSH or HTTPS).
NOTES_REMOTE="git@github.com:matchupikchu/notes_work.git"

# Branch the notes are pushed to.
NOTES_BRANCH="main"
