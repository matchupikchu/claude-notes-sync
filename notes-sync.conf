# Konfiguracja notes-sync (składnia powłoki: KLUCZ="wartość").
# Zmienne środowiskowe o tych samych nazwach i opcje push-notes mają pierwszeństwo.

# Katalog z notatkami (to on jest repozytorium wysyłanym na zdalne repo).
NOTES_DIR="$HOME/notatki-claude"

# Adres URL zdalnego repozytorium (SSH lub HTTPS).
NOTES_REMOTE="git@github.com:matchupikchu/notes_work.git"

# Gałąź, na którą wysyłane są notatki.
NOTES_BRANCH="main"
